<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamLinks Simulation</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --primary-color: #3b82f6;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: "Inter", sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
        }

        #controls {
            margin-bottom: 24px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            width: fit-content;
            align-self: center;
        }

        button {
            background-color: transparent;
            border: 1px solid transparent;
            padding: 8px 16px;
            border-radius: 10px;
            font-family: "Inter", sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background-color: #f1f5f9;
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        button.primary {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
            border: 1px solid #2563eb;
        }

        button.primary:hover {
            background-color: #2563eb;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.98);
        }

        #visual-container {
            flex: 1;
            background: var(--surface-color);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        /* Styles ported from visual.less */
        .node-shape {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .links path {
            transition: opacity 0.3s ease, stroke-width 0.3s ease;
        }
    </style>
</head>

<body>
    <div id="controls">
        <button onclick="simulation.reset()">Reset</button>
        <button onclick="simulation.toggleTheme()">Toggle Theme</button>
        <button onclick="simulation.toggleValues()">Toggle Values</button>
        <button onclick="simulation.applyModernTheme()"
            style="background:#3B82F6; color:white; border:none; padding:5px 10px; border-radius:4px; font-weight:bold;">✨
            Modern App Theme</button>
    </div>
    <div id="visual-container"></div>

    <script>
        // Mock Power BI Interfaces and Data
        const mockData = {
            columns: ["Region", "Category", "Sub-Category", "Product"],
            rows: [
                ["North America", "Electronics", "Computers", "Business Laptop"],
                ["North America", "Electronics", "Computers", "Gaming Laptop"],
                ["North America", "Electronics", "Phones", "Smartphone Pro"],
                ["Europe", "Electronics", "Phones", "Smartphone Lite"],
                ["Europe", "Furniture", "Chairs", "Office Chair"],
                ["Asia", "Furniture", "Tables", "Standing Desk"],
                ["Asia", "Electronics", "Computers", "Business Laptop"],
                ["North America", "Services", "Updates", "Software Update"],
                ["Europe", "Services", "Support", "Premium Support"],
            ]
        };

        class StreamLinksSimulation {
            constructor(container) {
                this.container = container;
                this.width = container.clientWidth;
                this.height = container.clientHeight;

                // Default settings from visual.ts
                this.settings = {
                    nodeWidth: 150,
                    nodeHeight: 40,
                    nodeShape: "roundedRect",
                    cornerRadius: 8,
                    nodeFillOpacity: 90,
                    nodeBorderStyle: "solid",
                    nodeBorderWidth: 2,
                    useCustomBorderColor: true,
                    nodeBorderColor: "#003B5C",
                    levelSpacing: 250,
                    nodeSpacing: 50,
                    fontSize: 10,
                    fontFamily: "Segoe UI",
                    textColor: "#ffffff",
                    wrapText: true,
                    maxCharsPerLine: 28,
                    showValues: true,
                    badgeTextSize: 9,
                    badgeTextColor: "#000000",
                    badgeFontFamily: "Segoe UI",
                    badgePosition: "top-right",
                    badgePaddingTop: 12,
                    badgePaddingRight: 5,
                    badgePaddingBottom: 0,
                    badgePaddingLeft: 0,
                    countMode: "out",
                    showLabel: false,
                    lineOpacity: 30,
                    linkWidth: 2,
                    highlightOpacity: 80,
                    linkStyle: "solid",
                    linkColorMode: "gradient",
                    customLinkColor: "#888888",
                    linkCurveStyle: "bezier",
                    showStartMarker: false,
                    startMarkerType: "circle",
                    startMarkerSize: 6,
                    showEndMarker: true,
                    endMarkerType: "arrow",
                    endMarkerSize: 8,
                    useCustomMarkerColors: false,
                    startMarkerColor: "#0078D4",
                    endMarkerColor: "#0078D4",
                    colors: ["#0078D4", "#009CDC", "#106EBE", "#005A9E", "#74B4E7", "#004578", "#96C9F4", "#003B5C"],
                    showEmptyPlaceholder: true,
                    showCounters: true,
                    headerCounterFontSize: 11,
                    headerCounterFontFamily: "Segoe UI",
                    headerCounterFontWeight: "bold",
                    headerCounterColor: "#000000",
                    headerCounterSeparator: "|",
                    headerTitleColor: "#000000",
                    headerTitleMatchNode: false,
                    headerTitleSize: 14,
                    headerTitleFontFamily: "Segoe UI",
                    showControls: true
                };

                this.nodes = new Map();
                this.links = [];
                this.nodeElements = new Map();
                this.selectedNodes = new Set();
                this.connectedNodes = new Set();

                this.init();
            }

            init() {
                this.svg = d3.select(this.container).append("svg")
                    .attr("width", "100%")
                    .attr("height", "100%");

                this.defs = this.svg.append("defs");
                this.fixedHeader = this.svg.append("g").attr("class", "fixed-header");
                this.mainGroup = this.svg.append("g").attr("id", "mainGroup");

                // Layout state
                this.zoomScale = 1;
                this.translateX = 0;
                this.translateY = 0;

                this.setupZoom();
                this.processData();
                this.render();

                window.addEventListener('resize', () => {
                    this.width = this.container.clientWidth;
                    this.height = this.container.clientHeight;
                    this.render();
                });
            }

            setupZoom() {
                const zoom = d3.zoom()
                    .scaleExtent([0.1, 4])
                    .on("zoom", (event) => {
                        this.mainGroup.attr("transform", event.transform);
                        this.zoomScale = event.transform.k;
                    });
                this.svg.call(zoom);
                this.zoomBehavior = zoom;
            }

            // --- Logic ported from Visual.ts ---

            normalizeValue(value) {
                if (value === null || value === undefined) return '';
                return String(value).trim();
            }

            makeId(levelIndex, value) {
                // Simple hash for simulation
                let hash = 0;
                const str = String(value);
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                return `L${levelIndex}_${Math.abs(hash).toString(36)}`;
            }

            getLevelColor(levelIndex) {
                return this.settings.colors[levelIndex % this.settings.colors.length];
            }

            processData() {
                this.nodes.clear();
                this.links = [];

                const columns = mockData.columns;
                const rows = mockData.rows;

                // 1. Create Nodes
                const nodesByLevel = new Map();

                columns.forEach((level, levelIndex) => {
                    const valueMap = new Map();
                    rows.forEach(row => {
                        const value = this.normalizeValue(row[levelIndex]);
                        if (value !== '') {
                            valueMap.set(value, (valueMap.get(value) || 0) + 1);
                        }
                    });
                    nodesByLevel.set(levelIndex, valueMap);
                });

                columns.forEach((levelName, levelIndex) => {
                    const valueMap = nodesByLevel.get(levelIndex);
                    const color = this.getLevelColor(levelIndex);

                    valueMap.forEach((count, value) => {
                        const id = this.makeId(levelIndex, value);
                        this.nodes.set(id, {
                            id,
                            level: levelName,
                            levelIndex,
                            value,
                            count, // Initial count, will update
                            color,
                            x: 0,
                            y: 0
                        });
                    });
                });

                // 2. Create Links
                for (let i = 0; i < columns.length - 1; i++) {
                    const pairSet = new Set();
                    rows.forEach(row => {
                        const sourceVal = this.normalizeValue(row[i]);
                        const targetVal = this.normalizeValue(row[i + 1]);
                        if (sourceVal && targetVal) {
                            const sourceId = this.makeId(i, sourceVal);
                            const targetId = this.makeId(i + 1, targetVal);
                            pairSet.add(`${sourceId}->${targetId}`);
                        }
                    });

                    pairSet.forEach(pair => {
                        const [sourceId, targetId] = pair.split('->');
                        const sourceNode = this.nodes.get(sourceId);
                        const targetNode = this.nodes.get(targetId);
                        if (sourceNode && targetNode) {
                            this.links.push({
                                source: sourceId,
                                target: targetId,
                                color: sourceNode.color,
                                sourceColor: sourceNode.color,
                                targetColor: targetNode.color
                            });
                        }
                    });
                }

                this.calculateNeighborCounts();
                this.calculateLayout();
            }

            calculateNeighborCounts() {
                const outNeighbors = new Map();
                const inNeighbors = new Map();
                this.nodes.forEach((_, id) => {
                    outNeighbors.set(id, new Set());
                    inNeighbors.set(id, new Set());
                });
                this.links.forEach(link => {
                    if (outNeighbors.has(link.source)) outNeighbors.get(link.source).add(link.target);
                    if (inNeighbors.has(link.target)) inNeighbors.get(link.target).add(link.source);
                });

                this.nodes.forEach((node, id) => {
                    let count = 0;
                    if (this.settings.countMode === 'out') count = outNeighbors.get(id)?.size || 0;
                    else if (this.settings.countMode === 'in') count = inNeighbors.get(id)?.size || 0;
                    else count = (outNeighbors.get(id)?.size || 0) + (inNeighbors.get(id)?.size || 0);
                    node.count = count;
                });
            }

            calculateLayout() {
                const nodesByLevel = new Map();
                this.nodes.forEach(node => {
                    if (!nodesByLevel.has(node.levelIndex)) nodesByLevel.set(node.levelIndex, []);
                    nodesByLevel.get(node.levelIndex).push(node);
                });

                // Sort by count
                nodesByLevel.forEach(nodes => nodes.sort((a, b) => b.count - a.count));

                // Position
                mockData.columns.forEach((_, levelIndex) => {
                    const levelNodes = nodesByLevel.get(levelIndex) || [];
                    const x = 50 + levelIndex * this.settings.levelSpacing;
                    const totalHeight = levelNodes.length * this.settings.nodeSpacing + (levelNodes.length - 1) * 10; // slightly different spacing calc
                    const startY = Math.max(50, (this.height - totalHeight) / 2);

                    levelNodes.forEach((node, index) => {
                        node.x = x;
                        node.y = startY + index * (this.settings.nodeHeight + 20); // Simpler spacing
                    });
                });
            }

            generateLinkPath(x1, y1, x2, y2) {
                const midX = (x1 + x2) / 2;
                // Bezier
                return `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`;
            }

            render() {
                this.mainGroup.selectAll("*").remove(); // Clear previous
                this.defs.selectAll("*").remove();
                this.fixedHeader.selectAll("*").remove();

                // Define markers
                this.createMarkers();

                this.renderLinks();
                this.renderNodes();
                this.renderHeaders();
            }

            createMarkers() {
                if (this.settings.showEndMarker) {
                    const marker = this.defs.append("marker")
                        .attr("id", "arrow-end")
                        .attr("viewBox", "0 0 10 10")
                        .attr("refX", 10)
                        .attr("refY", 5)
                        .attr("markerWidth", 6)
                        .attr("markerHeight", 6)
                        .attr("orient", "auto-start-reverse");

                    marker.append("path")
                        .attr("d", "M 0 0 L 10 5 L 0 10 z")
                        .attr("fill", "#666"); // Default color
                }
            }

            renderLinks() {
                const linkGroup = this.mainGroup.append("g").attr("class", "links");

                this.links.forEach((link, i) => {
                    const source = this.nodes.get(link.source);
                    const target = this.nodes.get(link.target);
                    if (!source || !target) return;

                    const x1 = source.x + this.settings.nodeWidth;
                    const y1 = source.y + this.settings.nodeHeight / 2;
                    const x2 = target.x;
                    const y2 = target.y + this.settings.nodeHeight / 2;

                    // Gradient
                    const gradientId = `grad-${i}`;
                    const gradient = this.defs.append("linearGradient")
                        .attr("id", gradientId)
                        .attr("gradientUnits", "userSpaceOnUse")
                        .attr("x1", x1).attr("y1", y1)
                        .attr("x2", x2).attr("y2", y2);

                    gradient.append("stop").attr("offset", "0%").attr("stop-color", link.sourceColor).attr("stop-opacity", this.settings.lineOpacity / 100);
                    gradient.append("stop").attr("offset", "100%").attr("stop-color", link.targetColor).attr("stop-opacity", this.settings.lineOpacity / 100);

                    linkGroup.append("path")
                        .attr("d", this.generateLinkPath(x1, y1, x2, y2))
                        .attr("stroke", `url(#${gradientId})`)
                        .attr("stroke-width", this.settings.linkWidth)
                        .attr("fill", "none")
                        .attr("data-source", link.source)
                        .attr("data-target", link.target)
                        .attr("marker-end", this.settings.showEndMarker ? "url(#arrow-end)" : null);
                });
            }

            renderNodes() {
                const nodeGroup = this.mainGroup.append("g").attr("class", "nodes");

                this.nodes.forEach(node => {
                    const g = nodeGroup.append("g")
                        .attr("transform", `translate(${node.x},${node.y})`)
                        .attr("data-id", node.id)
                        .style("cursor", "pointer")
                        .on("click", (e) => this.handleNodeClick(e, node))
                        .on("mouseenter", function () {
                            d3.select(this).style("filter", "brightness(1.1)");
                        })
                        .on("mouseleave", function () {
                            d3.select(this).style("filter", "none");
                        });

                    // Node Shape (supports shadows if class has it)
                    g.append("rect")
                        .attr("class", "node-rect")
                        .attr("width", this.settings.nodeWidth)
                        .attr("height", this.settings.nodeHeight)
                        .attr("rx", this.settings.cornerRadius)
                        .attr("fill", node.color)
                        .attr("stroke", this.settings.nodeBorderColor)
                        .attr("stroke-width", this.settings.nodeBorderWidth)
                        .attr("fill-opacity", this.settings.nodeFillOpacity / 100);

                    // Mock Icon (if modern theme)
                    if (this.settings.showIcons) {
                        g.append("circle")
                            .attr("cx", 20)
                            .attr("cy", this.settings.nodeHeight / 2)
                            .attr("r", 10)
                            .attr("fill", "rgba(255,255,255,0.2)");

                        g.append("text")
                            .attr("x", 20)
                            .attr("y", this.settings.nodeHeight / 2)
                            .attr("dy", "0.35em")
                            .attr("text-anchor", "middle")
                            .attr("fill", "white")
                            .style("font-family", "Segoe UI Emoji")
                            .text("🔹"); // Placeholder icon
                    }

                    // Text
                    const textX = this.settings.showIcons ? 40 : this.settings.nodeWidth / 2;
                    const textAnchor = this.settings.showIcons ? "start" : "middle";

                    g.append("text")
                        .attr("x", textX)
                        .attr("y", this.settings.nodeHeight / 2)
                        .attr("dy", "0.35em")
                        .attr("text-anchor", textAnchor)
                        .attr("fill", this.settings.textColor)
                        .style("font-family", this.settings.fontFamily)
                        .style("font-size", this.settings.fontSize + "px")
                        .style("font-weight", this.settings.fontWeight || "normal")
                        .style("pointer-events", "none")
                        .text(node.value.length > 20 ? node.value.substring(0, 18) + "..." : node.value);

                    // Badge
                    if (this.settings.showValues) {
                        g.append("circle")
                            .attr("cx", this.settings.nodeWidth - 10)
                            .attr("cy", 10)
                            .attr("r", 8)
                            .attr("fill", "white")
                            .attr("stroke", node.color); // Match node color for cleaner look

                        g.append("text")
                            .attr("x", this.settings.nodeWidth - 10)
                            .attr("y", 10)
                            .attr("dy", "0.35em")
                            .attr("text-anchor", "middle")
                            .style("font-size", "9px")
                            .style("font-weight", "bold")
                            .attr("fill", node.color)
                            .text(node.count);
                    }
                });
            }

            handleNodeClick(event, node) {
                const isCtrl = event.ctrlKey || event.metaKey;
                if (isCtrl) {
                    if (this.selectedNodes.has(node.id)) this.selectedNodes.delete(node.id);
                    else this.selectedNodes.add(node.id);
                } else {
                    if (this.selectedNodes.has(node.id) && this.selectedNodes.size === 1) this.selectedNodes.clear();
                    else {
                        this.selectedNodes.clear();
                        this.selectedNodes.add(node.id);
                    }
                }
                this.updateHighlighting();
            }

            updateHighlighting() {
                const hasSelection = this.selectedNodes.size > 0;

                if (!hasSelection) {
                    this.mainGroup.selectAll(".nodes g").transition().style("opacity", 1);
                    this.mainGroup.selectAll(".links path")
                        .transition()
                        .style("opacity", 1)
                        .attr("stroke-opacity", this.settings.lineOpacity / 100);
                    return;
                }

                // Identify connected nodes/links via data rows
                const relevantRowIndices = new Set();
                mockData.rows.forEach((row, rowIndex) => {
                    for (const selectedId of this.selectedNodes) {
                        const selectedNode = this.nodes.get(selectedId);
                        if (selectedNode && this.normalizeValue(row[selectedNode.levelIndex]) === selectedNode.value) {
                            relevantRowIndices.add(rowIndex);
                            return;
                        }
                    }
                });

                const activeNodes = new Set();
                const activeLinks = new Set(); // "sourceId->targetId"

                relevantRowIndices.forEach(rowIndex => {
                    const row = mockData.rows[rowIndex];
                    mockData.columns.forEach((_, colIndex) => {
                        const val = this.normalizeValue(row[colIndex]);
                        if (val) activeNodes.add(this.makeId(colIndex, val));
                    });
                    for (let i = 0; i < mockData.columns.length - 1; i++) {
                        const s = this.normalizeValue(row[i]);
                        const t = this.normalizeValue(row[i + 1]);
                        if (s && t) activeLinks.add(`${this.makeId(i, s)}->${this.makeId(i + 1, t)}`);
                    }
                });

                // Apply opacity
                this.mainGroup.selectAll(".nodes g")
                    .transition()
                    .style("opacity", function () {
                        const id = d3.select(this).attr("data-id");
                        return activeNodes.has(id) ? 1 : 0.1;
                    });

                this.mainGroup.selectAll(".links path")
                    .transition()
                    .style("opacity", function () {
                        const s = d3.select(this).attr("data-source");
                        const t = d3.select(this).attr("data-target");
                        return activeLinks.has(`${s}->${t}`) ? 1 : 0.05;
                    });
            }

            reset() {
                this.selectedNodes.clear();
                this.updateHighlighting(); // restore opacity
                this.svg.transition().duration(750).call(this.zoomBehavior.transform, d3.zoomIdentity);
            }

            toggleValues() {
                this.settings.showValues = !this.settings.showValues;
                this.render();
            }

            applyModernTheme() {
                // "App-like" aesthetic settings
                this.settings.colors = ["#3B82F6", "#10B981", "#8B5CF6", "#F59E0B", "#EF4444", "#EC4899"];
                this.settings.cornerRadius = 12;
                this.settings.nodeHeight = 50;
                this.settings.nodeSpacing = 60;
                this.settings.nodeFillOpacity = 100;
                this.settings.nodeBorderWidth = 0; // Clean look
                this.settings.lineOpacity = 40;
                this.settings.textColor = "#ffffff";
                this.settings.fontWeight = "600";
                this.settings.fontSize = 11;
                this.settings.fontFamily = "Inter, sans-serif";
                this.settings.showIcons = true; // New Feature Flag

                // Add drop shadow
                if (!this.defs.select("#dropShadow").node()) {
                    const filter = this.defs.append("filter")
                        .attr("id", "dropShadow")
                        .attr("height", "130%");
                    filter.append("feGaussianBlur")
                        .attr("in", "SourceAlpha")
                        .attr("stdDeviation", 3);
                    filter.append("feOffset")
                        .attr("dx", 0)
                        .attr("dy", 2)
                        .attr("result", "offsetblur");
                    filter.append("feComponentTransfer")
                        .append("feFuncA")
                        .attr("type", "linear")
                        .attr("slope", 0.3);
                    const merge = filter.append("feMerge");
                    merge.append("feMergeNode");
                    merge.append("feMergeNode").attr("in", "SourceGraphic");
                }

                // Re-render
                this.render();

                // Post-process to add shadows/gradients to rects that d3 rendered
                this.mainGroup.selectAll(".node-rect").style("filter", "url(#dropShadow)");
            }
        }

        const simulation = new StreamLinksSimulation(document.getElementById('visual-container'));

    </script>
</body>

</html>
